{% extends "base.html" %}
{% block content %}
    <div class="stopwatch">
      <div class="circle">
        <span class="time" id="display">00:00:00</span>
      </div>

      <div class="controls">
        <button class="buttonPlay" type="button" aria-label="Запустить таймер">▶</button>
        <button class="buttonReset" type="button" aria-label="Сбросить таймер">↺</button>
      </div>
    </div>
{% endblock %}
