<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="description"
          content="ManageTime — сервис учёта времени по проектам и задачам">
    <title>ManageTime</title>
    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='img/icon.png') }}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css"
          integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header>
    <h1 class="title_app">
        <a href="https://github.com/Mr-Zoom-13/ManageTime" class="project_link">
            <span class="title_image" aria-hidden="true"></span>
            <span class="title_app_text">ManageTime</span>
        </a>
    </h1>
    {% if start is not defined %}
        <form action="{{ url_for('logout') }}" method="post" class="logout_form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="logout_button" aria-label="Выйти">
                <img src="{{ url_for('static', filename='img/exit.png') }}"
                     class="exit" alt="Выйти">
            </button>
        </form>
    {% endif %}
    {% if back is defined %}
        <a href="{{ back }}" class="a_back" aria-label="Назад">←</a>
    {% endif %}
</header>
<main class="container-fluid">
    {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='scripts/main.js') }}"></script>
</body>
</html>
